<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gi santista</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            position: relative;
            font-family: sans-serif;
        }

        .heart-container {
            position: absolute;
            bottom: -100px;
            animation: floatUp linear forwards;
            opacity: 0;
        }

        .heart-svg {
            filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.2));
        }

        @keyframes floatUp {
            0% {
                bottom: -100px;
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                bottom: 110vh;
                opacity: 0;
            }
        }

        @keyframes sway {
            0% {
                transform: translateX(-20px) rotate(-10deg);
            }
            100% {
                transform: translateX(20px) rotate(10deg);
            }
        }
        
        .main-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(15px, 4vw, 30px);
            z-index: 10;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .logos-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(15px, 5vw, 40px);
        }

        .team-logo {
            width: clamp(70px, 25vw, 120px);
            height: auto;
            max-height: 150px;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.25));
            transition: transform 0.3s ease;
        }

        .team-logo:hover {
            transform: scale(1.1);
        }

        .pulsing-heart {
            width: clamp(40px, 12vw, 60px);
            height: clamp(40px, 12vw, 60px);
            fill: #ff2a2a;
            filter: drop-shadow(0 0 10px rgba(255, 42, 42, 0.6));
            animation: pulse 1s infinite alternate ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.3); }
        }

        .bottom-text {
            color: rgba(255, 255, 255, 0.95);
            font-size: clamp(1.4rem, 6vw, 2.2rem);
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.15);
            text-align: center;
            margin: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="logos-row">
            <img src="https://upload.wikimedia.org/wikipedia/pt/b/b4/Corinthians_simbolo.png" alt="Escudo Corinthians" class="team-logo">
            
            <svg class="pulsing-heart" viewBox="0 0 32 29.6">
                <path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2 c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/>
            </svg>

            <img src="https://upload.wikimedia.org/wikipedia/commons/3/35/Santos_logo.svg" alt="Escudo Santos" class="team-logo">
        </div>

        <h2 class="bottom-text">Dá pra negociar...</h2>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            function createHeart() {
                const container = document.createElement('div');
                container.classList.add('heart-container');

                container.style.left = Math.random() * 100 + 'vw';

                const floatDuration = Math.random() * 5 + 4;
                container.style.animationDuration = floatDuration + 's';

                const size = Math.random() * 25 + 15;
                
                const opacity = Math.random() * 0.4 + 0.2;

                const svgContent = `
                    <svg class="heart-svg" viewBox="0 0 32 29.6" style="width: ${size}px; height: ${size}px; fill: rgba(255, 255, 255, ${opacity});">
                        <path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2 c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/>
                    </svg>
                `;
                container.innerHTML = svgContent;

                const svgElement = container.querySelector('.heart-svg');
                const swayDuration = Math.random() * 2 + 1.5;
                svgElement.style.animation = `sway ${swayDuration}s ease-in-out infinite alternate`;

                document.body.appendChild(container);

                setTimeout(() => {
                    container.remove();
                }, floatDuration * 1000);
            }

            setInterval(createHeart, 150);
        });
    </script>
</body>
</html>
